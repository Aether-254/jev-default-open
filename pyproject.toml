[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jev-default-open"
version = "0.1.0"
description = "Context-aware Windows open routing powered by Jev."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<0.29",
    "pydantic>=2.12,<3",
    "PySide6>=6.10,<7",
    "pywin32>=311",
    "uiautomation>=2.0,<3",
    "sqlcipher3==0.6.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13,<1",
]

[project.scripts]
jev-default-open = "jev_open.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_open"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
