name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Parse PowerShell scripts
        run: |
          foreach ($script in Get-ChildItem -LiteralPath scripts -Filter '*.ps1') {
            $parseErrors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              throw ($parseErrors | Out-String)
            }
          }
      - name: Prepare project environment
        run: ./scripts/bootstrap.ps1 -Python (Get-Command python).Source -SkipChecks
      - name: Lint and test offline
        run: ./scripts/test.ps1

  native:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure MSVC x64
        run: cmake -S native -B native/build -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON
      - name: Build native components
        run: cmake --build native/build --config Release --parallel
      - name: Run isolated native contract tests
        run: ctest --test-dir native/build -C Release --output-on-failure --no-tests=error
